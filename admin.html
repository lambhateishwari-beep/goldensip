<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Owner · The Golden Sip Café</title>
<style>
:root{--bg:#120d09;--card:#1b140d;--line:#35291a;--tx:#f4ede0;--mu:#a89c85;--gold:#e3ae4f;--gt:#1a1204;--red:#e5594f;--grn:#5cc27a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif;padding-bottom:90px}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:500;margin:0}
a{color:var(--gold)}
.wrap{max-width:860px;margin:0 auto;padding:18px}
input,select{background:#0f0b07;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:15px system-ui,sans-serif;width:100%}
input[type=checkbox]{width:auto}
.btn{background:var(--gold);color:var(--gt);border:0;border-radius:10px;padding:10px 16px;font:700 14px system-ui,sans-serif;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}.ghost{background:none;color:var(--tx);border:1px solid var(--line)}
.x{background:none;border:1px solid var(--line);color:var(--mu);border-radius:8px;padding:8px 10px;cursor:pointer}.x:hover{color:var(--red);border-color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.bar>*{flex:1;min-width:120px}.bar>.btn,.bar>.x{flex:0 0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font:500 26px Georgia,serif;color:var(--gold)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chips button{white-space:nowrap;background:none;color:var(--mu);border:1px solid var(--line);border-radius:99px;padding:7px 14px;cursor:pointer}
.chips button.on{background:var(--gold);color:var(--gt);border-color:var(--gold);font-weight:700}
.dish{display:grid;grid-template-columns:1fr 110px;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.dish.off{opacity:.5}.dish .ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;grid-column:1/-1}
.pr{display:flex;align-items:center;gap:4px}.pr input{width:92px}.pr small{color:var(--mu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.msg{color:var(--red);min-height:20px;margin:8px 0}.note{background:#2a1d0d;border:1px solid var(--gold);border-radius:12px;padding:10px 14px;margin-top:14px;color:#f0d9a8}
.save{position:fixed;left:0;right:0;bottom:0;background:rgba(18,13,9,.96);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;justify-content:center;z-index:5}
.login{max-width:420px;margin:7vh auto}.login label{display:block;margin:14px 0 6px;font-weight:600}
.hide{display:none!important}
</style></head><body>
<div class="wrap" id="app"></div>
<div class="save hide" id="saveBar"><span id="saveMsg" style="color:var(--mu)">No changes</span><button class="btn" id="saveBtn" disabled>Save changes</button></div>
<script>
const $ = s => document.querySelector(s);
let M = null, cur = 0, dirty = false, q = '';

function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e[k] = v;
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) e.append(c instanceof Node ? c : document.createTextNode(c == null ? '' : c));
  return e;
}
async function api(path, method, body) {
  const r = await fetch(path, { method: method || 'GET', credentials: 'same-origin',
    headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'Something went wrong.'); e.status = r.status; throw e; }
  return j;
}
function touch() {
  dirty = true; $('#saveBtn').disabled = false; $('#saveMsg').textContent = 'Unsaved changes'; $('#saveMsg').style.color = 'var(--gold)';
}
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- login ---------- */
function showLogin(info) {
  $('#saveBar').classList.add('hide');
  const err = h('div', { class: 'msg' });
  const id = h('input', { type: 'text', autocomplete: 'username', placeholder: 'Email or phone number' });
  const pw = h('input', { type: 'password', autocomplete: 'current-password' });
  const go = async () => {
    err.textContent = ''; btn.disabled = true;
    try { await api('/api/login', 'POST', { id: id.value, password: pw.value }); await loadPanel(); }
    catch (e) { err.textContent = e.message; btn.disabled = false; }
  };
  const btn = h('button', { class: 'btn', style: 'width:100%', onclick: go }, 'Open owner dashboard');
  pw.onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#app').replaceChildren(h('div', { class: 'login' },
    h('a', { href: '/' }, '← Back to public menu'),
    h('h1', { style: 'font-size:40px;margin:26px 0 8px' }, 'Owner access'),
    h('p', { style: 'color:var(--mu)' }, 'Sign in to add dishes, create categories and update live prices.'),
    info && !info.passwordSet ? h('div', { class: 'note' }, 'Owner password is not set yet. Add ADMIN_PASSWORD in Vercel → Settings → Environment Variables, then redeploy.') : '',
    h('label', {}, 'Owner email or phone'), id, h('label', {}, 'Password'), pw, err, btn));
}

/* ---------- panel ---------- */
async function loadPanel() {
  M = await api('/api/menu'); dirty = false;
  if (cur >= M.categories.length) cur = 0;
  render();
}
function render() {
  const sess = window.__sess || {};
  const cats = M.categories, c = cats[cur];
  const total = cats.reduce((n, x) => n + x.items.length, 0);
  const avail = cats.reduce((n, x) => n + x.items.filter(i => i.available).length, 0);
  const root = h('div', {});
  root.append(
    h('div', { class: 'top' },
      h('div', {}, h('small', { style: 'color:var(--gold);letter-spacing:.2em' }, 'THE GOLDEN SIP CAFÉ'), h('h1', { style: 'font-size:34px' }, 'Menu manager')),
      h('div', {}, h('a', { class: 'btn ghost', href: '/', style: 'text-decoration:none;display:inline-block;margin-right:6px' }, 'View public menu'),
        h('button', { class: 'btn ghost', onclick: logout }, 'Log out'))),
    sess.storage === false ? h('div', { class: 'note' }, 'Database is not connected yet, so changes cannot be saved. Vercel → Storage → Create Database → Upstash Redis.') : '',
    h('div', { class: 'stats' }, stat(total, 'Total dishes'), stat(cats.length, 'Categories'), stat(avail, 'Available now')));

  // add category
  const nc = h('input', { placeholder: 'New category name' });
  const ng = h('select', {}, h('option', { value: 'food' }, 'Food'), h('option', { value: 'bev' }, 'Beverage'));
  root.append(h('div', { class: 'panel' }, h('h3', {}, 'Add category'),
    h('div', { class: 'bar' }, nc, ng, h('button', { class: 'btn', onclick: () => {
      const n = nc.value.trim(); if (!n) return;
      cats.push({ id: '', name: n, group: ng.value, hidden: false, items: [] }); cur = cats.length - 1; touch(); render();
    } }, '+ Category'))));

  // categories + current category tools
  const chips = h('div', { class: 'chips' }, cats.map((x, i) => h('button', { class: i === cur ? 'on' : '', onclick: () => { cur = i; q = ''; render(); } }, x.name + ' (' + x.items.length + ')')));
  const panel = h('div', { class: 'panel' }, h('h3', {}, 'Live menu items'),
    h('p', { style: 'color:var(--mu);margin:4px 0 10px' }, 'Change a price or availability, then press “Save changes” at the bottom. Customers see it right after.'), chips);
  if (c) {
    const rn = h('input', { value: c.name, oninput: e => { c.name = e.target.value; touch(); } });
    const grp = h('select', { onchange: e => { c.group = e.target.value; touch(); } },
      h('option', { value: 'food', selected: c.group !== 'bev' }, 'Food'), h('option', { value: 'bev', selected: c.group === 'bev' }, 'Beverage'));
    const hid = h('input', { type: 'checkbox', checked: c.hidden, onchange: e => { c.hidden = e.target.checked; touch(); } });
    panel.append(h('div', { class: 'bar' }, rn, grp,
      h('label', { style: 'display:flex;gap:6px;align-items:center;flex:0 0 auto' }, hid, 'Hide from customers'),
      h('button', { class: 'x', onclick: () => {
        if (!confirm('Delete category "' + c.name + '" and its ' + c.items.length + ' dishes?')) return;
        cats.splice(cur, 1); cur = 0; touch(); render();
      } }, 'Delete category')));

    // add dish
    const dn = h('input', { placeholder: 'Dish name' });
    const dt = h('select', {}, h('option', { value: 'veg' }, 'Veg'), h('option', { value: 'nonveg' }, 'Non-veg'), h('option', { value: '' }, 'Drink / other'));
    const ds = h('input', { placeholder: 'Section (optional)' });
    const dp = h('input', { type: 'number', min: '0', placeholder: 'Price ₹' });
    panel.append(h('div', { class: 'bar' }, dn, dt, ds, dp, h('button', { class: 'btn', onclick: () => {
      const n = dn.value.trim(), p = Math.round(Number(dp.value));
      if (!n || dp.value === '' || !(p >= 0)) return alert('Enter the dish name and price.');
      c.items.unshift({ id: '', name: n, desc: '', section: ds.value.trim(), type: dt.value, available: true, prices: [{ label: '', price: p }] });
      touch(); render();
    } }, '+ Add dish')));

    panel.append(h('input', { placeholder: 'Search dishes', value: q, oninput: e => {
      q = e.target.value.toLowerCase();
      panel.querySelectorAll('.dish').forEach(r => r.classList.toggle('hide', !r.dataset.n.includes(q)));
    } }));
    c.items.forEach(it => panel.append(dishRow(c, it)));
    if (!c.items.length) panel.append(h('p', { style: 'color:var(--mu)' }, 'No dishes in this category yet.'));
  }
  root.append(panel);
  $('#app').replaceChildren(root);
  $('#saveBar').classList.remove('hide');
  $('#saveBtn').disabled = !dirty;
}
const stat = (n, t) => h('div', { class: 'stat' }, h('b', {}, String(n)), t);

function dishRow(c, it) {
  const row = h('div', { class: 'dish' + (it.available ? '' : ' off'), 'data-n': it.name.toLowerCase() });
  const color = it.type === 'veg' ? 'var(--grn)' : it.type === 'nonveg' ? 'var(--red)' : 'var(--mu)';
  row.append(
    h('div', { style: 'display:flex;gap:8px;align-items:center' }, h('span', { class: 'dot', style: 'background:' + color }),
      h('input', { value: it.name, oninput: e => { it.name = e.target.value; row.dataset.n = it.name.toLowerCase(); touch(); } })),
    h('select', { onchange: e => { it.type = e.target.value; touch(); render(); } },
      h('option', { value: 'veg', selected: it.type === 'veg' }, 'Veg'), h('option', { value: 'nonveg', selected: it.type === 'nonveg' }, 'Non-veg'), h('option', { value: '', selected: !it.type }, 'Other')),
    h('div', { class: 'ctl' },
      it.prices.map(p => h('div', { class: 'pr' }, p.label ? h('small', {}, p.label) : '', h('span', {}, '₹'),
        h('input', { type: 'number', min: '0', value: String(p.price), oninput: e => { p.price = Math.round(Number(e.target.value)) || 0; touch(); } }))),
      it.section ? h('small', { style: 'color:var(--mu)' }, it.section) : '',
      h('label', { style: 'display:flex;gap:6px;align-items:center;margin-left:auto' },
        h('input', { type: 'checkbox', checked: it.available, onchange: e => { it.available = e.target.checked; row.classList.toggle('off', !it.available); touch(); } }), 'Available'),
      h('button', { class: 'x', title: 'Remove dish', onclick: () => {
        if (!confirm('Remove "' + it.name + '"?')) return;
        c.items.splice(c.items.indexOf(it), 1); touch(); render();
      } }, '🗑')));
  return row;
}

async function save() {
  const btn = $('#saveBtn'); btn.disabled = true; $('#saveMsg').textContent = 'Saving…';
  try {
    await api('/api/menu', 'PUT', M);
    M = await api('/api/menu'); dirty = false; render();
    $('#saveMsg').textContent = 'Saved ✓ Customers can see the changes'; $('#saveMsg').style.color = 'var(--grn)';
  } catch (e) {
    if (e.status === 401) { alert('Session expired. Please log in again.'); return showLogin(window.__sess); }
    $('#saveMsg').textContent = e.message; $('#saveMsg').style.color = 'var(--red)'; btn.disabled = false;
  }
}
async function logout() {
  if (dirty && !confirm('You have unsaved changes. Log out anyway?')) return;
  dirty = false; try { await api('/api/logout', 'POST', {}); } catch (e) {}
  showLogin(window.__sess);
}
$('#saveBtn').onclick = save;

(async () => {
  try { window.__sess = await api('/api/session'); } catch (e) { window.__sess = {}; }
  if (window.__sess.admin) { try { await loadPanel(); return; } catch (e) {} }
  showLogin(window.__sess);
})();
</script></body></html>
